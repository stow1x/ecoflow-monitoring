name: ecoflow-monitoring

# Everything this stack needs is inside the three published images, so this file plus a filled-in
# .env is the whole install -- no clone, no build. Contributors who want to build from source or
# edit dashboards live add compose.build.yaml on top; see CONTRIBUTING.md.
#
# A fork's CI publishes to its own namespace, so the registry prefix is overridable: set
# ECOFLOW_IMAGE=ghcr.io/<your-account>/ecoflow-monitoring in .env to run your own images.

services:
  exporter:
    image: ${ECOFLOW_IMAGE:-ghcr.io/stow1x/ecoflow-monitoring}:${ECOFLOW_TAG:-latest}
    environment:
      ECOFLOW_MODE: ${ECOFLOW_MODE:-private}
      ECOFLOW_EMAIL: ${ECOFLOW_EMAIL:-}
      ECOFLOW_PASSWORD: ${ECOFLOW_PASSWORD:-}
      ECOFLOW_ACCESS_KEY: ${ECOFLOW_ACCESS_KEY:-}
      ECOFLOW_SECRET_KEY: ${ECOFLOW_SECRET_KEY:-}
      ECOFLOW_API_HOST: ${ECOFLOW_API_HOST:-}
      ECOFLOW_DISCOVERY_HOST: ${ECOFLOW_DISCOVERY_HOST:-}
      ECOFLOW_SERIALS: ${ECOFLOW_SERIALS:-}
      POLL_INTERVAL_SECONDS: ${POLL_INTERVAL_SECONDS:-60}
      SNAPSHOT_INTERVAL_SECONDS: ${SNAPSHOT_INTERVAL_SECONDS:-300}
      DEVICE_TTL_SECONDS: ${DEVICE_TTL_SECONDS:-900}
      EXPORTER_PORT: ${EXPORTER_PORT:-9101}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DUMP_RAW_DIR: ${DUMP_RAW_DIR:-}
    expose:
      - "9101"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:'+(process.env.EXPORTER_PORT??9101)+'/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # The container filesystem is read-only, so DUMP_RAW_DIR only works when it points at
    # a writable mount. Uncomment both lines and set DUMP_RAW_DIR=/data/raw in .env:
    # volumes:
    #   - ./raw:/data/raw

  prometheus:
    image: ${ECOFLOW_IMAGE:-ghcr.io/stow1x/ecoflow-monitoring}/prometheus:${ECOFLOW_TAG:-latest}
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=365d
      - --web.enable-lifecycle
    volumes:
      - prometheus_data:/prometheus
    expose:
      - "9090"
    healthcheck:
      test:
        - CMD
        - wget
        - --quiet
        - --tries=1
        - --spider
        - http://127.0.0.1:9090/-/healthy
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    depends_on:
      exporter:
        condition: service_healthy
    restart: unless-stopped

  grafana:
    image: ${ECOFLOW_IMAGE:-ghcr.io/stow1x/ecoflow-monitoring}/grafana:${ECOFLOW_TAG:-latest}
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?set GRAFANA_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_FEATURE_TOGGLES_DASHBOARDNEWLAYOUTS: "false"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
    restart: unless-stopped

volumes:
  prometheus_data:
  grafana_data:
