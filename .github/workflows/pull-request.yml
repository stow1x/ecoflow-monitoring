name: pull request

on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  classify:
    name: conventional title and label
    runs-on: ubuntu-latest
    steps:
      - name: Validate the title
        if: github.event.pull_request.user.login != 'dependabot[bot]'
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            docs
            test
            build
            ci
            chore
            revert
          requireScope: false
          subjectPattern: ^(?![A-Z])(?!.*\.$).+$
          subjectPatternError: |
            The subject "{subject}" is invalid: start with a lower-case letter and do not end with
            a period. Example: "fix(private): reconnect after an idle broker disconnect".

      - name: Apply the type label
        if: github.event.pull_request.user.login != 'dependabot[bot]'
        uses: actions/github-script@v7
        with:
          script: |
            const title = context.payload.pull_request.title;
            const match = /^(\w+)(\([^)]*\))?(!)?:/.exec(title);
            if (!match) return;

            const colors = {
              feat: '0e8a16',
              fix: 'd73a4a',
              perf: '5319e7',
              refactor: 'fbca04',
              docs: '0075ca',
              test: 'c2e0c6',
              build: 'c5def5',
              ci: 'c5def5',
              chore: 'ededed',
              revert: 'b60205',
              'breaking change': 'b60205',
            };

            const body = context.payload.pull_request.body ?? '';
            const wanted = [match[1]];
            if (match[3] === '!' || /^BREAKING[ -]CHANGE:/m.test(body)) wanted.push('breaking change');

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const number = context.payload.pull_request.number;

            for (const name of wanted) {
              try {
                await github.rest.issues.getLabel({ owner, repo, name });
              } catch {
                await github.rest.issues.createLabel({ owner, repo, name, color: colors[name] ?? 'ededed' });
              }
            }

            const current = await github.rest.issues.listLabelsOnIssue({ owner, repo, issue_number: number });
            const managed = Object.keys(colors);
            for (const label of current.data) {
              if (managed.includes(label.name) && !wanted.includes(label.name)) {
                await github.rest.issues.removeLabel({ owner, repo, issue_number: number, name: label.name });
              }
            }

            await github.rest.issues.addLabels({ owner, repo, issue_number: number, labels: wanted });
