name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: typecheck, lint, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run lint
      - run: pnpm test

  docker:
    name: image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: ecoflow-monitoring:ci
          cache-from: type=gha,scope=exporter
          cache-to: type=gha,mode=max,scope=exporter
      - name: Exporter refuses to start without configuration
        run: |
          set +e
          output=$(docker run --rm ecoflow-monitoring:ci 2>&1)
          status=$?
          echo "$output"
          test "$status" -eq 78 || { echo "expected exit 78, got $status"; exit 1; }
          echo "$output" | grep -q ECOFLOW_EMAIL || { echo "missing credential diagnostics"; exit 1; }

      - uses: docker/build-push-action@v7
        with:
          context: ./prometheus
          push: false
          load: true
          tags: ecoflow-monitoring-prometheus:ci
          cache-from: type=gha,scope=prometheus
          cache-to: type=gha,mode=max,scope=prometheus
      - name: Baked Prometheus image carries the config and rules
        run: |
          docker run --rm --entrypoint promtool ecoflow-monitoring-prometheus:ci \
            check config /etc/prometheus/prometheus.yml
          docker run --rm --entrypoint sh ecoflow-monitoring-prometheus:ci \
            -c 'promtool check rules /etc/prometheus/rules/*.yml'

      - uses: docker/build-push-action@v7
        with:
          context: ./grafana
          push: false
          load: true
          tags: ecoflow-monitoring-grafana:ci
          cache-from: type=gha,scope=grafana
          cache-to: type=gha,mode=max,scope=grafana
      - name: Baked Grafana image carries provisioning and dashboards
        run: |
          docker run --rm --entrypoint sh ecoflow-monitoring-grafana:ci -c '
            set -e
            test -f /etc/grafana/provisioning/datasources/prometheus.yml
            test -f /etc/grafana/provisioning/dashboards/ecoflow.yml
            test -f /etc/grafana/dashboards/ecoflow-overview.json
          '
      - name: Dashboards are not under the grafana_data volume path
        run: |
          # /var/lib/grafana is a named volume at runtime; anything provisioned from there is
          # shadowed by the populated volume on every later image update. Read the YAML key
          # rather than grepping for a path substring, and fail when it cannot be read at all --
          # an empty result must not pass as "not under the volume".
          path=$(docker run --rm --entrypoint sh ecoflow-monitoring-grafana:ci \
            -c "sed -n 's/^[[:space:]]*path:[[:space:]]*//p' /etc/grafana/provisioning/dashboards/ecoflow.yml")
          test -n "$path" || { echo "could not read the provisioned dashboard path"; exit 1; }
          echo "provisioned dashboard path: $path"
          case "$path" in
            /var/lib/grafana|/var/lib/grafana/*)
              echo "dashboards would be shadowed by the grafana_data volume"; exit 1 ;;
          esac
          docker run --rm --entrypoint sh ecoflow-monitoring-grafana:ci -c "ls -1 '$path'/*.json >/dev/null"

      - name: Nothing either image needs lives under a volume mountpoint
        run: |
          # The general form of the bug above: /var/lib/grafana and /prometheus are both named
          # volumes, so any file baked beneath them is frozen at whatever first seeded the volume.
          docker run --rm --entrypoint sh ecoflow-monitoring-grafana:ci \
            -c 'test -z "$(find /var/lib/grafana -type f)"' \
            || { echo "image content under /var/lib/grafana will be shadowed"; exit 1; }
          docker run --rm --entrypoint sh ecoflow-monitoring-prometheus:ci \
            -c 'test -z "$(find /prometheus -type f)"' \
            || { echo "image content under /prometheus will be shadowed"; exit 1; }

  stack:
    name: prometheus and grafana config
    runs-on: ubuntu-latest
    env:
      PROMETHEUS_VERSION: 3.14.0
    steps:
      - uses: actions/checkout@v7
      - name: Install promtool
        run: |
          tarball="prometheus-${PROMETHEUS_VERSION}.linux-amd64"
          curl -fsSL -o promtool.tar.gz \
            "https://github.com/prometheus/prometheus/releases/download/v${PROMETHEUS_VERSION}/${tarball}.tar.gz"
          tar -xzf promtool.tar.gz "${tarball}/promtool"
          sudo install -m 0755 "${tarball}/promtool" /usr/local/bin/promtool
      - name: promtool version matches the image base
        run: |
          grep -qx "FROM prom/prometheus:v${PROMETHEUS_VERSION}" prometheus/Dockerfile \
            || { echo "PROMETHEUS_VERSION drifted from prometheus/Dockerfile"; exit 1; }
      - run: promtool check config prometheus/prometheus.yml
      - run: promtool check rules prometheus/rules/*.yml
      - name: Dashboard JSON parses
        run: node -e "JSON.parse(require('fs').readFileSync('grafana/dashboards/ecoflow-overview.json','utf8'))"
      - name: Compose files are valid
        run: |
          docker compose config -q
          docker compose -f compose.yaml -f compose.build.yaml config -q
        env:
          GRAFANA_PASSWORD: ci
      - name: compose.yaml is self-contained (no build, no bind mounts)
        run: |
          # The published compose.yaml is the whole install: a user curls it and runs it, with no
          # clone. A build: directive or any bind mount silently reintroduces that requirement.
          # Assert on mount TYPE, not on path spelling: `docker compose config` renders a relative
          # source as an absolute path, so a pattern matching "prometheus/" never fires.
          config=$(docker compose config)
          if printf '%s\n' "$config" | grep -q 'build:'; then
            echo "compose.yaml must not build"; exit 1
          fi
          if printf '%s\n' "$config" | grep -q 'type: bind'; then
            echo "compose.yaml must not bind-mount anything from the working tree"
            printf '%s\n' "$config" | grep -B2 -A2 'type: bind'
            exit 1
          fi
          echo "self-contained: ok"
        env:
          GRAFANA_PASSWORD: ci
