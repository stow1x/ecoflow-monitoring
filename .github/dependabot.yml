version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
    groups:
      dev-dependencies:
        dependency-type: development
      production-dependencies:
        dependency-type: production
    ignore:
      # typescript-eslint does not support the TypeScript 7 Go port yet, so the
      # type-aware lint rules stop working the moment this is bumped.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"

  - package-ecosystem: docker
    directories:
      - /
      - /prometheus
      - /grafana
    schedule:
      interval: weekly
    commit-message:
      prefix: "build"
    ignore:
      # The image must stay on a Node LTS line: the exporter ships TypeScript
      # sources and relies on type stripping being stable, not experimental.
      - dependency-name: node
        update-types: ["version-update:semver-major"]
