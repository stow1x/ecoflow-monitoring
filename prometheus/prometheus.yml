global:
  scrape_interval: 30s
  scrape_timeout: 10s
  evaluation_interval: 30s
  external_labels:
    monitor: ecoflow

rule_files:
  - rules/*.yml

scrape_configs:
  - job_name: ecoflow
    metrics_path: /metrics
    static_configs:
      - targets:
          - exporter:9101

  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090
